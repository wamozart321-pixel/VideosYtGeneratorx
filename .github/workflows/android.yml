name: Compilar Videosyt.apk

on:
  push:
    branches: [main, app-web]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Videosyt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Videosyt-Android
          path: android/Videosyt.apk

      - name: Publicar descarga
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-ultima --yes --cleanup-tag || true
          gh release create android-ultima Videosyt.apk --title "Videosyt para Android" --notes "Descarga Videosyt.apk en el teléfono e instálalo (permite instalar apps de fuentes desconocidas)."
